[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonbank"
version = "0.1.0"
description = "Banco Jean — sistema bancário em POO"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.setuptools]
# explícito para que a descoberta automática não empacote `tests` junto
packages = ["backend"]
py-modules = ["interface"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["core"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# CA-06: cobertura do domínio de 90% ou mais
fail_under = 90

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends`/`Query`/`Header` em valor padrão é o idioma do FastAPI, não o
# antipadrão de argumento mutável que a B008 existe para pegar.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
    "fastapi.Path", "fastapi.Body", "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# testes exercitam erros de propósito
"tests/*" = ["B017"]
