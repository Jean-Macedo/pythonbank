name: CI

on:
  push:
    branches: [main]
  pull_request:

# Uma execução por ramo: empurrar duas vezes seguidas cancela a anterior em vez
# de deixar duas filas competindo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dominio:
    name: Domínio e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Testes de domínio
        # sem banco: `tests/integracao` e `tests/api` se pulam sozinhos, e é
        # justamente essa a garantia de que o domínio não depende de nada
        run: pytest tests --ignore=tests/integracao --ignore=tests/api

  banco:
    name: Integração com PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Testes de integração
        # O banco de teste é criado e migrado pela própria suíte, com o esboço
        # de `auth` — não precisa da stack do Supabase aqui (DT-07).
        run: pytest tests/integracao
        env:
          BANCO_TESTE_DSN: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  interface:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Checagem de tipos
        run: npx tsc --noEmit
      - name: Testes
        run: npx vitest run
      - name: Build
        run: npm run build

  imagens:
    name: Imagens Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose sem avisos
        run: docker compose config --quiet
      - name: Construir backend
        run: docker build -t banco-backend ./backend
      - name: Construir frontend
        run: docker build -t banco-frontend ./frontend
