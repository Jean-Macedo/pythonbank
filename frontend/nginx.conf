server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: qualquer caminho desconhecido devolve o index, para que as rotas do
    # React funcionem quando alguém recarrega a página fora da raiz.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A configuração muda a cada subida do container; servi-la de cache faria
    # o navegador insistir no endereço antigo da API.
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # O bundle tem hash no nome, então pode ser guardado indefinidamente.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
